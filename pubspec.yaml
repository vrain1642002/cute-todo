name: cute_todo
description: A delightful todo app that makes productivity fun
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase - use compatible versions
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  
  # Google Sign-In
  google_sign_in: ^6.2.2
  
  # State Management
  provider: ^6.1.2
  
  # UI Components
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  google_fonts: ^6.2.1
  
  # Utilities
  intl: ^0.20.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  
  # Charts & Analytics
  fl_chart: ^0.69.2
  
  # Others
  cached_network_image: ^3.4.1
  animations: ^2.0.11
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/lang/

  # Enable generation of localization
  generate: true
